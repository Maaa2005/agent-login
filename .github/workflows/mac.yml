# 作者以外の Mac（GitHub の Mac）で、試験・入れる・入れた後の確認・消す、を通す。
# 指紋の承認（agent-login check と本物のログイン）は、指紋の読み取り機が無いので確かめない。
name: mac
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: sw_vers && uname -m && node -v && csrutil status
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: install
        run: ./install.sh
      - name: install-check
        # GitHub の Mac は保護機能（SIP）が切ってあり、署名で断るはずのデバッガが付けられてしまう。
        # SIP が切れている時だけ、その1件の FAIL を許す。ほかの FAIL や、SIP が入っている Mac での FAIL は落とす。
        run: |
          set +e
          sh tests/install-check.sh 2>&1 | tee /tmp/ic.log
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" = 0 ] && exit 0
          csrutil status | grep -q 'status: disabled' || { echo "SIP が入っているのに FAIL"; exit 1; }
          fails=$(grep -c '^FAIL' /tmp/ic.log || true)
          [ "$fails" = 1 ] && grep -q '^FAIL node: デバッガを断らなかった' /tmp/ic.log || { echo "デバッガ以外の FAIL がある"; exit 1; }
          echo "SIP が切れた Mac なので、デバッガの1件だけを許して通す"
      - name: uninstall
        # 消す前の yes は端末からしか読まないので、expect で端末を用意して答える。
        run: |
          expect -c 'set timeout 120; spawn ./uninstall.sh; expect "yes"; send "yes\r"; expect eof; catch wait r; exit [lindex $r 3]'
          test ! -e /opt/agent-login && test ! -e /usr/local/bin/agent-login
